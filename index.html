<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DevDogs">
  <meta name="theme-color" content="#00c2cb">
  <link rel="apple-touch-icon" href="/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <title>DevDogs</title>
  <script>
    // Silencia el warning BENIGNO de ResizeObserver (los Charts nativos lo disparan);
    // el overlay de error de dev de Muten lo trataba como fatal. Capturing + temprano.
    window.addEventListener("error", function (e) {
      if (e && e.message && e.message.indexOf("ResizeObserver loop") !== -1) {
        e.stopImmediatePropagation();
        e.preventDefault();
      }
    }, true);
  </script>
  <!-- Boot splash (lazy-load screen): painted instantly from HTML, before the app JS boots,
       then fades out on its own via CSS. No bootstrap script. -->
  <style>
    #boot{ position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:18px; background:linear-gradient(140deg,#00c2cb,#0a9aa3);
      animation:boot-out .45s ease 1s forwards; }
    #boot img{ display:block; }
    #boot .b-mark{ width:96px; height:96px; object-fit:contain; filter:brightness(0) invert(1);
      animation:boot-pulse 1s ease-in-out infinite; }
    #boot .b-word{ height:30px; width:auto; object-fit:contain; filter:brightness(0) invert(1); opacity:.95; }
    @keyframes boot-pulse{ 0%,100%{ transform:scale(1); opacity:.88 } 50%{ transform:scale(1.06); opacity:1 } }
    @keyframes boot-out{ to{ opacity:0; visibility:hidden; pointer-events:none } }
    @media (prefers-reduced-motion:reduce){ #boot .b-mark{ animation:none } }
  </style>
</head>
<body>
  <div id="boot">
    <img class="b-mark" src="/devdogs-mark.png" alt="DevDogs">
    <img class="b-word" src="/devdogs-wordmark.png" alt="DevDogs">
  </div>
  <div id="app"></div>
  <script type="module" src="/src/app.muten"></script>
</body>
</html>
